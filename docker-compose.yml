services:
  ssr-server:
    build:
      context: ./frontend
      dockerfile: server/Dockerfile
    ports:
      - "3033:3000"
    depends_on:
      - backend
    command: ["node", "--watch-path=./index.js", "--watch-path=./dist/server", "index.js"]
    volumes:
      - ./uploads:/app/uploads
      - ./frontend/server/index.js:/app/index.js
      - ./frontend/dist/client:/app/dist/client
      - ./frontend/dist/server:/app/dist/server
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8000
      - UPLOADS_DIR=/app/uploads

  backend:
    build: ./backend
    env_file: "./backend/.env"
    ports:
      - "8006:8000"
      - "8678:5678"
      - "8679:5679"
      - "6080:6080"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./frontend/dist/client:/app/dist/client

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./database:/data/db

